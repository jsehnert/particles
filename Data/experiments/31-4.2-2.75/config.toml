[paths]
vol_data_path = "/Users/jim/Documents/GitHub/particles/Data/M50L-21.raw"

[vol_info]
voxel_size = 0.01640435

[analysis]
slab_thickness = 31
baseline_method = "median" #Baseline estimate method 'median' or 'mean'
vol_top = 200
vol_bottom = 4060

# Slice-by-slice analysis parameters
dead_zone_scale = 4.0 # resisual dead zone scale in units of sigma
area_threshold = 2 # Minimum area for connected components in the particle slice mask

# Full volume analysis parameters
slices_per_chunk = 256 # Number of slices to process in one chunk
z_extent_max = 16 # Longest admissible axial extent of a candidate in slices
vol_threshold = 3 # minimu volume for connected components in the particle volume mask
high_threshold_scale = 4.2 # High threshold for candidate dections (scales sigma)
low_threshold_scale = 2.75 # Low threshold for candidate growth (scales sigma)
aniso_factor = 1.2 # Controls the z_extent relative to the lateral extent for a particle. Values < 1.0 are more restrictive, values > 1.0 are more permissive. A value of 1.0 is a good starting point for most cases. Regardless, clipping is applied to the z_extent_max to prevent unreasonably long candidates from being accepted. The default of 1.0 is a good starting point for most cases.
small_vol_cutoff = 5 # Minimum number of voxels for valid candidates with small z_extent
z_pad = 2 # Additional slop factor for the z_extent test to prevent integer roundoff from clipping borderline mid-size blobs.
small_z_bounds = [1, 4] # Inclusive z_extent bounds for small components

[noise]
clip_scale = 2.5 #Clipping performed when estimating the gaussian noise
slice_step = 50 #Step size for sampling slices when estimating noise statistics across the volume

[metal]
gray_margin = 20 #Grayscale margin allowed to grow into
min_area = 200   #Minimum area of metal mask components

[grayscale_landmarks]
slice_step = 200 #Step size for sampling slices when estimating grayscale landmarks across the volume
