[paths]
vol_data_dir = "/Users/jim/Documents/GitHub/particles/Data/volumes"

[analysis]
slab_thickness = 25
baseline_method = "median" #Baseline estimate method 'median' or 'mean'

# Slice-by-slice analysis parameters
dead_zone_scale = 4.2 # resisual dead zone scale in units of sigma
area_threshold = 3 # Minimum area for connected components in the particle slice mask

# Full volume analysis parameters
slices_per_chunk = 64 # Number of slices to process for candidates in one chunk
n_workers = 7 # Number of workers to use for candidate extraction
storage_margin = 3 # Per-side voxel-dump bbox padding (voxels); must be >= shell_radius
shell_radius = 3 # Shell radius for edge_contrast/decay_drop/grayscale features (voxels)
# Recall-first research default: skip the shape-discrimination gate (_axial_ok:
# anisotropy, min_fill, small-regime routing, z_lo) and defer shape rejection to the
# downstream classifier. Only min_seed_voxels and z_extent_max still gate. Set true to
# re-enable the shape gates. Shape params below remain configured but inert when false.
enforce_shape_gates = false

preprocess_slices_per_chunk = 512 # Number of slices to preprocess in one chunk
preprocess_n_workers = 12 # Number of workers to use for preprocessing

[noise]
clip_scale = 2.5 #Clipping performed when estimating the gaussian noise
slice_step = 50 #Step size for sampling slices when estimating noise statistics across the volume

[metal]
metal_offset_percentile = 40
gray_margin = 20  # uint8 grayscale delta for metal-mask hysteresis (low = threshold - margin); NOT spatial
# Physical area so the metal min-area is resolution-independent across cell formats.
# Converted to a pixel count at runtime with the per-cell voxel_size (see cfg_data.py).
# At voxel_size=0.01640435mm this reproduces the historical 200 px value.
min_area_mm2 = 0.053820539784500014  # Minimum area of metal mask components (was 200 px)

[grayscale_landmarks]
slice_step = 200 #Step size for sampling slices when estimating grayscale landmarks across the volume


